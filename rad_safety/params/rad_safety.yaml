rad_safety_monitor_node:
  ros__parameters:
    # Hard emergency threshold — intentionally higher than local_recovery's
    # critical_dose_mrem_hr so only one node drives navigation at a time.
    # local_recovery handles the 2.0 mrem/hr case with smarter search logic;
    # this node fires only on truly catastrophic doses as a hard brake.
    emergency_threshold_mrem_hr: 8.0
    retreat_distance_m: 2.5
    # Number of consecutive dose readings to average before triggering;
    # prevents false retreats from transient sensor spikes.
    dose_smoothing_window: 5
    robot_base_frame: ""
    map_frame: "map"
