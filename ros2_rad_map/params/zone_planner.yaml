rad_zone_planner_node:
  ros__parameters:
    use_sim_time: True
    heatmap_topic: "/rad_heatmap/raw_mean_map"
    map_topic: "/map"
    radiation_threshold: 0.5 
    min_zone_area: 50.0
    map_frame: "map"
    
    # Watershed hypertuning parameters
    noise_removal_kernel_size: 3
    noise_removal_iterations: 2
    background_dilation_iterations: 3
    peak_seed_radius_px: 5