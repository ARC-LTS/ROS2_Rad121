zone_selector_node: # This should match the name you give your node when launching
  ros__parameters:
    clicked_point_topic: "/clicked_point"       # Topic to listen for PointStamped messages (e.g., from RViz)
    output_yaml_file: ""  # Resolved at launch time via get_package_share_directory('rad121_monitor')/params/predefined_zones.yaml
    default_zone_radius: 1.5                    # Default radius in meters for newly defined zones
    map_frame: "map"                            # The TF frame in which zone coordinates will be stored (should match RViz fixed frame)
    zone_label_prefix: ""                  # Prefix for automatically generated zone labels (e.g., Area_A, Area_B)
