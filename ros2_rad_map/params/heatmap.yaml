rad_heatmap_node:
  ros__parameters:
    use_sim_time: True
    sensor_frame: "base_link"
    map_frame: "map"
    # output_directory: ""  # Defaults to /tmp; override via launch argument to set a persistent output path

    background_threshold_mrem_hr: 0.0
    raycasting_max_sources: 5
    raycasting_max_distance_m: 20.0
    gp_update_frequency: 0.2


rad_mapper_node:
  ros__parameters:
    target_frame: "base_link"
    source_frame: "odom"

gp_predictor_node:
  ros__parameters:
    kernel:
      type: "Matern52"
      lengthscale: 2.0 # Fixed larger value for stability
    fix_lengthscale: True # Fixed to prevent shimmering
    fix_rho: True # Fixed to prevent field scaling jitter
    use_multi_fidelity: True
    initial_rho: 1.0
    # Cap on the prior's contribution, in mrem/hr, applied after the prior is
    # inverse-transformed out of log space. This was previously 0.1, which was
    # a workaround for the prior being consumed in log units: the "initial high
    # predictions" it was suppressing were the untransformed log-space values,
    # and at 0.1 the cap clamped the prior to a near-constant, discarding its
    # spatial structure. With prior_transform applied, 100 mrem/hr is a genuine
    # guard against pathological extrapolation and does not bind in normal use.
    low_fi_max_prior: 100.0
    # The offline pipeline trains on log(1+y); set 'none' only for a prior
    # fitted directly in mrem/hr.
    prior_transform: "log1p"
    # Include the offline A-11 discrepancy GP in the prior mean. Set False to
    # reproduce the pre-fix behaviour (low-fidelity process alone).
    use_discrepancy: True
    model_path: ""  # Resolved at launch time via get_package_share_directory('ros2_rad_map')/models/gp_model.pkl
    sparse_threshold: 300 # Increased for better accuracy before switching to sparse
    rad_smoothing_window: 5           # Rolling average window before feeding readings into GP training
    gp_noise_variance_min: 0.5        # GP likelihood noise floor; prevents fitting exactly through spikes
    landmark_background_min: 0.3      # Minimum effective background (mrem/hr) used for landmark threshold
    # Max allowed predictive std dev for a candidate peak in find_peaks_callback.
    # Was 1.0 (the old default): observed phantom detections in bench-scale testing
    # had std in the 1.0-1.15 range, i.e. right at/above the old cutoff, so it
    # wasn't actually filtering the marginal, low-confidence local optima that
    # scipy's random-restart search turns up away from real data. 0.6 was tried
    # first but suppressed real (weak, ~1.5-2.5 mrem/hr) sources too; 0.8 is the
    # bench-tested value that filtered phantoms while still confirming a real one.
    peak_confidence_threshold: 0.8

peak_finder_client_node:
  ros__parameters:
    sensor_frame: "base_link"
    map_frame: "map"
    num_starts: 30
    marker_scale: 0.5
    matching_threshold_m: 1.5
    # Was 0.1: below rad_simulation's own background_radiation_max (1.0 mrem/hr,
    # see rad_simulation/params/sensor_simulator.yaml), so background noise alone
    # could pass the candidate-peak filter. Raised with margin above background
    # while staying below the smallest real source floor (low_intensity_min=2.5).
    min_peak_mrem_hr: 1.5

rad_costmap_visualizer_node:
  ros__parameters:
    heatmap_topic: "/rad_heatmap/raw_mean_map"
    map_topic: "/map"
    warning_threshold_mrem_hr: 1.0
    evacuation_threshold_mrem_hr: 2.0
