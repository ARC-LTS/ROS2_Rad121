local_recovery_node:
  ros__parameters:
    critical_dose_mrem_hr: 2.0      # cost-function / safe-zone boundary
    acute_dose_rate_mrem_hr: 10.0   # hard evacuation trigger
    safe_dose_threshold_mrem_hr: 1.0
    recovery_search_distance_m: 15.0
    robot_base_frame: ""
    map_frame: "map"
    fallback_retreat_distance_m: 3.0
    return_to_origin: false
    origin_x: 0.0
    origin_y: 0.0
    stop_explore_service: "/explore_node/stop"
    start_explore_service: "/explore_node/start"