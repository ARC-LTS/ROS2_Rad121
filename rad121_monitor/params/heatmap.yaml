rad_heatmap_node:
  ros__parameters:
    use_sim_time: True
    sensor_frame: "base_link"
    map_frame: "map"
    output_directory: "/home/brendoncintas/radmon_ws/data/" # Changed from output_file

    # Sample filtering parameters
    min_valid_mrem: 0.4
    min_sample_mrem: 0.0
    background_threshold_mrem_hr: 0.0

    # Image processing parameters
    gaussian_sigma: 5.0
    gaussian_blur_size: 9  # must be odd
    
    # New parameter for controlling the real-time error map
    error_map_update_frequency: 1.0 # In Hz

